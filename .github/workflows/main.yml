name: Build AgreyFlix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Verify project structure (IMPORTANT)
      - name: Check project files
        run: |
          echo "=== ROOT FILES ==="
          ls -R

      # 4. Make gradlew executable
      - name: Grant permission to gradlew
        run: |
          chmod +x android/gradlew || echo "gradlew not found"

      # 5. Verify Android folder
      - name: Verify Android structure
        run: |
          echo "=== ANDROID FOLDER ==="
          ls -R android

      # 6. Build APK with FULL logs (VERY IMPORTANT)
      - name: Build Debug APK (with full logs)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --info --debug || exit 1

      # 7. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AgreyFlix-APK
          path: android/app/build/outputs/apk/debug/*.apk

      # 8. If failed show logs
      - name: Show failure logs
        if: failure()
        run: |
          echo "BUILD FAILED ❌ - SHOWING PROJECT STRUCTURE"
          ls -R android
          echo "CHECK GRADLE FILES ABOVE"
